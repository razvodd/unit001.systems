<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Ready</title>

  <style>
    :root {
      --x: 24px;
      --y: 24px;

      --display-size: clamp(90px, 12vw, 210px);
      --text-size: clamp(18px, 1.4vw, 24px);
      --phone-size: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      background: #fff;
      color: #000;

      font-family: Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a,
    a:link,
    a:visited,
    a:hover,
    a:focus,
    a:active {
      color: inherit;
      text-decoration: none;
    }


    /* EMPTY HOME AREA */

    .home-link {
      position: fixed;

      top: 0;
      left: 0;

      width: 140px;
      height: 72px;

      z-index: 300;
    }


    /* MENU BUTTON */

    .menu {
      position: fixed;

      top: var(--y);
      right: var(--x);

      z-index: 300;

      width: 46px;
      height: 34px;

      padding: 0;

      border: 0;
      background: transparent;

      cursor: pointer;
    }

    .menu span {
      position: absolute;

      top: 50%;
      right: 0;

      width: 38px;
      height: 2px;

      background: #000;

      transform:
        translateY(-50%)
        rotate(0deg);

      transform-origin: center;

      transition:
        transform .25s ease,
        background .2s ease;
    }

    body.menu-open .menu span {
      background: #fff;

      transform:
        translateY(-50%)
        rotate(90deg);
    }


    /* CONTENT */

    .content {
      position: fixed;

      left: var(--x);
      top: 55%;

      width: min(
        720px,
        calc(100vw - 48px)
      );

      transform: translateY(-50%);
    }


    /* TITLE */

    h1 {
      margin:
        0
        0
        52px
        0;

      font-size: var(--display-size);
      line-height: .72;

      font-weight: 400;
      letter-spacing: -.075em;

      transform: translateX(-0.055em);
    }


    /* TEXT */

    .text {
      max-width: 620px;

      margin: 0 0 36px;

      font-size: var(--text-size);
      line-height: 1.25;
    }

    .ready-list {
      display: flex;
      flex-direction: column;

      max-width: 620px;

      margin: 0 0 36px;

      font-size: var(--text-size);
      line-height: 1.25;
    }


    /* PHONE */

    .page-phone {
      position: fixed;

      left: var(--x);
      bottom: var(--y);

      z-index: 20;

      font-size: var(--phone-size);
      line-height: 1;

      letter-spacing: -.025em;
    }


    /* MENU NAV */

    .display-nav {
      display: flex;
      flex-direction: column;

      align-items: flex-start;

      gap: 14px;

      margin-bottom: 32px;
    }

    .display-nav a {
      display: block;

      margin: 0;

      font-size: var(--display-size);
      line-height: .72;

      font-weight: 400;
      letter-spacing: -.075em;

      transform: translateX(-0.055em);
    }


    /* OVERLAY */

    .overlay {
      position: fixed;

      inset: 0;

      z-index: 100;

      background: #000;
      color: #fff;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity .2s ease,
        visibility .2s ease;
    }

    body.menu-open .overlay {
      opacity: 1;
      visibility: visible;

      pointer-events: auto;
    }

    .overlay-bottom {
      position: absolute;

      left: var(--x);
      bottom: var(--y);
    }

    .overlay .phone {
      display: block;

      font-size: var(--phone-size);
      line-height: 1;

      letter-spacing: -.025em;
    }


    /* MOBILE */

    @media (max-width: 700px) {

      :root {
        --x: 18px;
        --y: 18px;

        --display-size: 24vw;
        --text-size: 18px;
        --phone-size: 22px;
      }

      .content {
        left: var(--x);
        top: 53%;

        width: calc(100vw - 36px);

        transform: translateY(-50%);
      }

      h1 {
        margin-bottom: 38px;
      }

      .text,
      .ready-list {
        margin-bottom: 30px;
      }

      .display-nav {
        gap: 10px;
        margin-bottom: 28px;
      }

      .menu span {
        width: 36px;
      }
    }
.home-link {
  top: var(--y);
  left: var(--x);
  width: auto;
  height: 34px;
  display: flex;
  align-items: center;
  font: 400 13px/1 Helvetica, Arial, sans-serif;
  color: #000;
  text-decoration: none;
}

body.menu-open .home-link {
  color: #fff;
}
  </style>
</head>


<body>


  <a
    class="home-link"
    href="/"
    aria-label="Home"
  >Ready.</a>


  <button
    class="menu"
    id="menu"
    type="button"
    aria-label="Open menu"
    aria-expanded="false"
  >
    <span></span>
  </button>


  <main class="content">

    <h1>
      Ready.
    </h1>


    <p class="text">
      For models, actors and casting.
    </p>


    <div class="ready-list">

      <span>MODEL READY</span>
      <span>ACTOR READY</span>
      <span>CAST READY</span>

    </div>


    <p class="text">
      Strong photos.<br>
      Clear video.<br>
      Useful feedback.<br>
      A better next step.
    </p>

  </main>
<a class="more-link" href="https://unit001.systems/r/l/">MORE</a>

<style>
.more-link,
.more-link:visited,
.more-link:hover,
.more-link:focus,
.more-link:active {
  font: inherit;
  color: inherit;
  text-decoration: none;
}
</style>

  <a
    class="page-phone"
    href="tel:+79808007001"
  >
    7.980.800.7.001
  </a>


  <!-- GLOBAL MENU -->

  <div class="overlay">

    <div class="overlay-bottom">

      <nav class="display-nav">

        <a href="/r/">
          Ready.
        </a>

        <a href="/e/">
          Events.
        </a>

      </nav>


      <a
        class="phone"
        href="tel:+79808007001"
      >
        7.980.800.7.001
      </a>

    </div>

  </div>


  <script>
    const menu =
      document.getElementById("menu");

    menu.addEventListener("click", () => {

      const open =
        document.body.classList.toggle(
          "menu-open"
        );

      menu.setAttribute(
        "aria-expanded",
        String(open)
      );

    });


    document.addEventListener(
      "keydown",
      event => {

        if (event.key === "Escape") {

          document.body.classList.remove(
            "menu-open"
          );

          menu.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      }
    );
  </script>


</body>
</html>
