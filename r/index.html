<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ready</title>

<style>
:root {
  --x: 24px;
  --y: 24px;

  --title-size: clamp(72px, 10vw, 170px);
  --menu-size: clamp(90px, 12vw, 210px);

  --text-size: clamp(16px, 1.25vw, 22px);
  --phone-size: 22px;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;

  background: #fff;
  color: #000;

  font-family: Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

a,
a:link,
a:visited,
a:hover,
a:focus,
a:active {
  color: inherit;
  text-decoration: none;
}


/* EMPTY HOME LINK */

.home-link {
  position: fixed;

  top: 0;
  left: 0;

  width: 140px;
  height: 72px;

  z-index: 300;
}


/* MENU */

.menu {
  position: fixed;

  top: var(--y);
  right: var(--x);

  z-index: 300;

  width: 44px;
  height: 32px;

  padding: 0;

  border: 0;
  background: transparent;

  cursor: pointer;
}

.menu span {
  position: absolute;

  top: 50%;
  right: 0;

  width: 36px;
  height: 2px;

  background: #000;

  transform: translateY(-50%) rotate(0deg);
  transform-origin: center;

  transition:
    transform .25s ease,
    background .2s ease;
}

body.menu-open .menu span {
  background: #fff;

  transform:
    translateY(-50%)
    rotate(90deg);
}


/* CONTENT */

.content {
  position: fixed;

  top: 15vh;
  left: var(--x);

  width: min(680px, calc(100vw - 48px));
}

h1 {
  margin: 0 0 42px;

  font-size: var(--title-size);
  line-height: .82;

  font-weight: 400;

  letter-spacing: -.075em;
}

.text,
.ready-list {
  margin: 0 0 30px;

  max-width: 600px;

  font-size: var(--text-size);
  line-height: 1.25;
}

.ready-list {
  display: flex;
  flex-direction: column;
}


/* BOTTOM */

.bottom {
  position: fixed;

  left: var(--x);
  bottom: var(--y);

  z-index: 20;
}

.site-nav {
  display: flex;
  flex-direction: column;

  align-items: flex-start;

  gap: 12px;

  margin-bottom: 30px;

  transform: translateX(-4px);
}

.site-nav a {
  display: block;

  margin: 0;

  font-size: var(--menu-size);
  line-height: .76;

  font-weight: 400;

  letter-spacing: -.075em;
}

.phone {
  display: block;

  font-size: var(--phone-size);
  line-height: 1;

  letter-spacing: -.025em;
}


/* OVERLAY */

.overlay {
  position: fixed;

  inset: 0;

  z-index: 100;

  background: #000;
  color: #fff;

  opacity: 0;
  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

body.menu-open .overlay {
  opacity: 1;
  visibility: visible;

  pointer-events: auto;
}

.overlay-bottom {
  position: absolute;

  left: var(--x);
  bottom: var(--y);
}


/* MOBILE */

@media (max-width: 700px) {
  :root {
    --x: 16px;
    --y: 16px;

    --title-size: 20vw;
    --menu-size: 24vw;

    --text-size: 15px;
    --phone-size: 22px;
  }

  .content {
    top: 12vh;

    width: calc(100vw - 32px);
  }

  h1 {
    margin-bottom: 30px;
  }

  .site-nav {
    gap: 8px;
    margin-bottom: 26px;
  }

  .menu span {
    width: 34px;
  }
}
</style>
</head>


<body>

<a
  class="home-link"
  href="/"
  aria-label="Home"
></a>


<button
  class="menu"
  id="menu"
  type="button"
  aria-label="Open menu"
  aria-expanded="false"
>
  <span></span>
</button>


<main class="content">

  <h1>READY</h1>

  <p class="text">
    For models, actors and casting.
  </p>

  <div class="ready-list">
    <span>MODEL READY</span>
    <span>ACTOR READY</span>
    <span>CAST READY</span>
  </div>

  <p class="text">
    Strong photos.<br>
    Clear video.<br>
    Useful feedback.<br>
    A better next step.
  </p>

</main>


<div class="bottom">

  <nav class="site-nav">
    <a href="/r/">READY</a>
    <a href="/e/">EVENT</a>
  </nav>

  <a
    class="phone"
    href="tel:+79808007001"
  >
    7.980.800.7.001
  </a>

</div>


<div class="overlay">

  <div class="overlay-bottom">

    <nav class="site-nav">
      <a href="/r/">READY</a>
      <a href="/e/">EVENT</a>
    </nav>

    <a
      class="phone"
      href="tel:+79808007001"
    >
      7.980.800.7.001
    </a>

  </div>

</div>


<script>
const menu = document.getElementById('menu');

menu.addEventListener('click', () => {
  const open =
    document.body.classList.toggle('menu-open');

  menu.setAttribute(
    'aria-expanded',
    String(open)
  );
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    document.body.classList.remove('menu-open');
    menu.setAttribute('aria-expanded', 'false');
  }
});
</script>

</body>
</html>
