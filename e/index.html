<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Events</title>

  <style>
    :root {
      --black: #000;
      --white: #fff;

      --pad-x: 24px;
      --pad-y: 24px;

      --text: clamp(16px, 1.25vw, 22px);
      --title: clamp(64px, 9vw, 150px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      background: var(--white);
      color: var(--black);

      font-family:
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    a,
    a:link,
    a:visited,
    a:hover,
    a:focus,
    a:active {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;

      width: 100vw;
      height: 100dvh;

      overflow: hidden;

      padding:
        max(var(--pad-y), env(safe-area-inset-top))
        max(var(--pad-x), env(safe-area-inset-right))
        max(var(--pad-y), env(safe-area-inset-bottom))
        max(var(--pad-x), env(safe-area-inset-left));
    }

    /* HEADER */

    .header {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 10;

      height: 72px;
    }

    /* EMPTY LOGO AREA */

    .home-link {
      position: absolute;

      top: 0;
      left: 0;

      width: 140px;
      height: 72px;
    }

    /* DASH */

    .menu-mark {
      position: absolute;

      top: var(--pad-y);
      right: var(--pad-x);

      width: 28px;
      height: 1px;

      background: #000;
    }

    /* CONTENT */

    .content {
      position: absolute;

      left: var(--pad-x);
      top: 15vh;

      width: min(760px, calc(100vw - 48px));
    }

    h1 {
      margin: 0 0 42px;

      font-size: var(--title);
      line-height: .82;

      font-weight: 400;

      letter-spacing: -.07em;
    }

    .intro,
    .copy,
    .list {
      max-width: 620px;

      margin: 0 0 32px;

      font-size: var(--text);
      line-height: 1.25;
    }

    .list {
      display: flex;
      flex-direction: column;

      gap: 5px;
    }

    /* PHONE */

    .phone {
      position: fixed;

      left: var(--pad-x);
      bottom: var(--pad-y);

      z-index: 10;

      font-size: 22px;
      line-height: 1;

      letter-spacing: -.025em;

      white-space: nowrap;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      :root {
        --pad-x: 16px;
        --pad-y: 16px;

        --text: 15px;
      }

      .content {
        top: 12vh;

        width: calc(100vw - 32px);
      }

      h1 {
        margin-bottom: 30px;

        font-size: 20vw;
      }

      .intro,
      .copy,
      .list {
        margin-bottom: 24px;
      }

      .phone {
        font-size: 22px;
      }
    }
  </style>
</head>


<body>

  <header class="header">

    <a
      class="home-link"
      href="/"
      aria-label="Home"
    ></a>

    <div
      class="menu-mark"
      aria-hidden="true"
    ></div>

  </header>


  <main class="page">

    <section class="content">

      <h1>
        EVENTS
      </h1>

      <p class="intro">
        An event happens once.
      </p>

      <div class="list">
        <span>PHOTO</span>
        <span>VIDEO</span>
        <span>AUDIO</span>
        <span>SPACE</span>
        <span>DATA</span>
        <span>TRACE</span>
      </div>

      <p class="copy">
        One event.<br>
        Multiple layers.
      </p>

      <p class="copy">
        I document what happened:<br>
        people, movement, space, sound and sequence.
      </p>

    </section>


    <a
      class="phone"
      href="tel:+79808007001"
    >
      7.980.800.7.001
    </a>

  </main>

</body>
</html>
