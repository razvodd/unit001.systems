<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Events — multi-layer documentation of people, movement, space, sound and sequence."
  >

  <title>Events</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <!-- use the same styles as Ready -->
  <link rel="stylesheet" href="../r/styles.css?v=66">
</head>

<body>

  <header class="header">

    <a
      class="wordmark"
      href="/"
      aria-label="Home"
    ></a>

    <button
      class="menu"
      aria-label="Open menu"
      aria-expanded="false"
    >
      <span></span>
    </button>

  </header>


  <nav
    class="overlay"
    aria-hidden="true"
  >
    <a href="/r/">READY</a>
    <a href="/e/">EVENT</a>
  </nav>


  <main id="top">

    <section class="page hero clear-hero">

      <h1>Events.</h1>

      <p class="lead">

        <span class="lead-list">
          <span>PHOTO</span>
          <span>VIDEO</span>
          <span>AUDIO</span>
          <span>SPACE</span>
          <span>DATA</span>
          <span>TRACE</span>
        </span>

        <span class="lead-summary">
          <span>ONE EVENT.</span>
          <span>MULTIPLE LAYERS.</span>
        </span>

      </p>

    </section>


    <section class="page intro">

      <p class="intro-label">
        EVENTS
      </p>

      <p class="intro-title">
        An event happens once.
      </p>

      <p class="intro-title">
        I document an event as a single system:
        people, movement, space, sound and sequence.
      </p>

    </section>


    <section class="page final">

      <p class="eyebrow">
        ONE EVENT.<br>
        MULTIPLE LAYERS.
      </p>

    </section>

  </main>


  <footer class="footer">

    <div class="contact-meta">
      <a href="tel:+79808007001">
        7.980.800.7.001
      </a>
    </div>

  </footer>


  <script>
  const menu = document.querySelector('.menu');
  const overlay = document.querySelector('.overlay');

  menu.addEventListener('click', () => {
    const open = menu.getAttribute('aria-expanded') === 'true';

    menu.setAttribute('aria-expanded', String(!open));
    overlay.setAttribute('aria-hidden', String(open));

    document.body.classList.toggle('menu-open', !open);
  });
</script>

</body>
</html>
