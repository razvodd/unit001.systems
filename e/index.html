<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event</title>

<style>
:root {
  --x: 24px;
  --y: 24px;
  --nav-size: clamp(52px, 7vw, 118px);
  --phone-size: 22px;

  --title: clamp(64px, 9vw, 150px);
  --text: clamp(16px, 1.25vw, 22px);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  background: #fff;
  color: #000;

  font-family: Helvetica, Arial, sans-serif;

  -webkit-font-smoothing: antialiased;
}

a,
a:link,
a:visited,
a:hover,
a:focus,
a:active {
  color: inherit;
  text-decoration: none;
}

.home-link {
  position: fixed;

  top: 0;
  left: 0;

  width: 140px;
  height: 72px;

  z-index: 200;
}

.menu {
  position: fixed;

  top: var(--y);
  right: var(--x);

  z-index: 300;

  width: 44px;
  height: 32px;

  padding: 0;

  border: 0;
  background: transparent;

  cursor: pointer;
}

.menu span {
  position: absolute;

  top: 50%;
  right: 0;

  width: 34px;
  height: 2px;

  background: #000;

  transform: translateY(-50%) rotate(0);
  transform-origin: center;

  transition:
    transform .25s ease,
    background .2s ease;
}

body.menu-open .menu span {
  background: #fff;

  transform:
    translateY(-50%)
    rotate(90deg);
}

/* CONTENT */

.content {
  position: fixed;

  left: var(--x);
  top: 15vh;

  width: min(680px, calc(100vw - 48px));
}

h1 {
  margin: 0 0 38px;

  font-size: var(--title);
  line-height: .82;

  font-weight: 400;

  letter-spacing: -.07em;
}

.text {
  margin: 0 0 30px;

  max-width: 600px;

  font-size: var(--text);
  line-height: 1.25;
}

.layers {
  margin: 0 0 30px;

  display: flex;
  flex-direction: column;

  font-size: var(--text);
  line-height: 1.25;
}

/* BOTTOM */

.bottom {
  position: fixed;

  left: var(--x);
  bottom: var(--y);

  z-index: 20;
}

.site-nav {
  display: flex;
  flex-direction: column;

  align-items: flex-start;

  margin-bottom: 22px;
}

.site-nav a {
  display: block;

  font-size: var(--nav-size);
  line-height: .82;

  letter-spacing: -.07em;
}

.phone {
  display: block;

  font-size: var(--phone-size);
  line-height: 1;

  letter-spacing: -.025em;
}

/* OVERLAY */

.overlay {
  position: fixed;

  inset: 0;

  z-index: 100;

  background: #000;
  color: #fff;

  opacity: 0;
  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

body.menu-open .overlay {
  opacity: 1;
  visibility: visible;

  pointer-events: auto;
}

.overlay-bottom {
  position: absolute;

  left: var(--x);
  bottom: var(--y);
}

.overlay .site-nav {
  margin-bottom: 22px;
}

@media (max-width: 700px) {
  :root {
    --x: 16px;
    --y: 16px;

    --nav-size: 17vw;
    --phone-size: 22px;

    --text: 15px;
  }

  .content {
    top: 12vh;

    width: calc(100vw - 32px);
  }

  h1 {
    margin-bottom: 28px;

    font-size: 20vw;
  }

  .menu span {
    width: 30px;
  }
}
</style>
</head>


<body>

<a
  class="home-link"
  href="/"
  aria-label="Home"
></a>


<button
  class="menu"
  id="menu"
  type="button"
  aria-label="Open menu"
  aria-expanded="false"
>
  <span></span>
</button>


<main class="content">

  <h1>
    EVENTS
  </h1>

  <p class="text">
    An event happens once.
  </p>


  <div class="layers">
    <span>PHOTO</span>
    <span>VIDEO</span>
    <span>AUDIO</span>
    <span>SPACE</span>
    <span>DATA</span>
    <span>TRACE</span>
  </div>


  <p class="text">
    One event.<br>
    Multiple layers.
  </p>


  <p class="text">
    I document what happened:<br>
    people, movement, space, sound and sequence.
  </p>

</main>


<div class="bottom">

  <nav class="site-nav">

    <a href="/r/">
      READY
    </a>

    <a href="/e/">
      EVENT
    </a>

  </nav>


  <a
    class="phone"
    href="tel:+79808007001"
  >
    7.980.800.7.001
  </a>

</div>


<div
  class="overlay"
  id="overlay"
>

  <div class="overlay-bottom">

    <nav class="site-nav">

      <a href="/r/">
        READY
      </a>

      <a href="/e/">
        EVENT
      </a>

    </nav>


    <a
      class="phone"
      href="tel:+79808007001"
    >
      7.980.800.7.001
    </a>

  </div>

</div>


<script>
const menu = document.getElementById('menu');

menu.addEventListener('click', () => {

  const open =
    document.body.classList.toggle('menu-open');

  menu.setAttribute(
    'aria-expanded',
    String(open)
  );

  menu.setAttribute(
    'aria-label',
    open
      ? 'Close menu'
      : 'Open menu'
  );

});


document.addEventListener(
  'keydown',
  event => {

    if (event.key === 'Escape') {

      document.body
        .classList
        .remove('menu-open');

      menu.setAttribute(
        'aria-expanded',
        'false'
      );

    }

  }
);
</script>


</body>
</html>
