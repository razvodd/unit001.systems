: '+stages[o.stage]+' → '+stages[d.stage]:'Данные заказа обновлены'):'Заказ создан',at:new Date().toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})}];const updated={...o,...d,history};if(old)orders[orders.findIndex(x=>x.id===o.id)]=updated;else orders.unshift(updated);const persisted=save();closeModal();render();if(persisted)toast(old?'Заказ обновлён. Изменения сохранены.':'Заказ создан. Можно назначать съёмку.');})}
function closeModal(){$('#modal').innerHTML='';document.body.style.overflow='';if(returnFocus&&document.contains(returnFocus))returnFocus.focus()}
function exportCSV(){const clean=v=>'"'+String(v).replace(/^[=+@-]/,"'").replaceAll('"','""')+'"';const lines=[['Номер','Школа','Класс','Город','Сумма','Получено','Остаток'],...scoped().map(o=>['CR-'+o.id,o.school,o.group,o.city,total(o),o.paid,total(o)-o.paid])];const blob=new Blob(['\ufeff'+lines.map(r=>r.map(clean).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='crocus-finance-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Финансы выгружены в CSV')}
