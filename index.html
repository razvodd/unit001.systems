<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="UNIT">
  <title>UNIT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;

      --overlay-bg: rgba(0, 0, 0, 0.94);
      --overlay-fg: #ffffff;

      --pad-x: 24px;
      --pad-y: 24px;

      --ease:
        cubic-bezier(.22, .72, .18, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    html {
      background: var(--bg);
    }

    body {
      position: relative;

      width: 100%;
      height: 100dvh;

      overflow: hidden;

      background: var(--bg);
      color: var(--fg);

      font-family:
        Inter,
        Helvetica,
        Arial,
        sans-serif;

      font-weight: 400;

      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    a {
      font: inherit;
    }

    a,
    a:link,
    a:visited,
    a:hover,
    a:focus,
    a:active {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .header {
      position: fixed;

      top: 0;
      left: 0;

      z-index: 100;

      width: 100%;

      padding:
        max(var(--pad-y), env(safe-area-inset-top))
        max(var(--pad-x), env(safe-area-inset-right))
        0
        max(var(--pad-x), env(safe-area-inset-left));

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      pointer-events: none;
    }


    /*
      Здесь намеренно пусто.
      На Ready на этом месте находится wordmark.
    */

    .wordmark-empty {
      width: 1px;
      height: 1px;
    }


    /* =========================================================
       MENU BUTTON
       ========================================================= */

    .menu {
      position: relative;

      width: 48px;
      height: 32px;

      margin: 0;
      padding: 0;

      border: 0;
      outline: 0;

      background: transparent;

      cursor: pointer;

      pointer-events: auto;

      -webkit-tap-highlight-color: transparent;
    }

    .menu span {
      position: absolute;

      top: 50%;
      right: 0;

      display: block;

      width: 30px;
      height: 1px;

      background: #000;

      transform:
        translateY(-50%)
        rotate(0deg);

      transform-origin: center;

      transition:
        width 220ms var(--ease),
        background 220ms var(--ease),
        transform 320ms var(--ease);
    }

    .menu:hover span {
      width: 40px;
    }


    /* MENU OPEN STATE */

    body.menu-open .menu span {
      width: 30px;

      background: #fff;

      transform:
        translateY(-50%)
        rotate(-45deg);
    }

    body.menu-open .menu:hover span {
      width: 38px;
    }


    /* =========================================================
       MAIN
       ========================================================= */

    .home {
      position: relative;

      width: 100%;
      height: 100dvh;

      background: #fff;
    }


    /* =========================================================
       PHONE
       ========================================================= */

    .phone {
      position: fixed;

      left: max(var(--pad-x), env(safe-area-inset-left));
      bottom: max(var(--pad-y), env(safe-area-inset-bottom));

      z-index: 20;

      display: inline-block;

      font-size: 14px;
      line-height: 1;

      font-weight: 400;

      letter-spacing: 0;

      white-space: nowrap;

      transition:
        transform 200ms var(--ease),
        opacity 200ms var(--ease);
    }

    .phone:hover {
      transform: translateX(4px);
    }


    /* =========================================================
       OVERLAY
       ========================================================= */

    .overlay {
      position: fixed;

      inset: 0;

      z-index: 80;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;

      padding:
        max(var(--pad-y), env(safe-area-inset-top))
        max(var(--pad-x), env(safe-area-inset-right))
        max(var(--pad-y), env(safe-area-inset-bottom))
        max(var(--pad-x), env(safe-area-inset-left));

      background: var(--overlay-bg);
      color: var(--overlay-fg);

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transform: translateY(-8px);

      transition:
        opacity 260ms var(--ease),
        visibility 260ms var(--ease),
        transform 360ms var(--ease);

      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    body.menu-open .overlay {
      opacity: 1;
      visibility: visible;

      pointer-events: auto;

      transform: translateY(0);
    }


    /* =========================================================
       OVERLAY NAVIGATION
       ========================================================= */

    .overlay-nav {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      gap: 0;
    }

    .overlay-nav a {
      position: relative;

      display: inline-flex;
      align-items: baseline;

      width: auto;

      padding: 3px 0;

      font-size: clamp(34px, 5.5vw, 92px);
      line-height: 0.98;

      font-weight: 400;

      letter-spacing: -0.045em;

      color: #fff;

      opacity: 1;

      transition:
        transform 220ms var(--ease),
        opacity 220ms var(--ease);
    }

    .overlay-nav:hover a {
      opacity: 0.28;
    }

    .overlay-nav a:hover {
      opacity: 1;

      transform: translateX(10px);
    }


    /* =========================================================
       MENU META
       ========================================================= */

    .overlay-meta {
      position: absolute;

      left: max(var(--pad-x), env(safe-area-inset-left));
      top: max(var(--pad-y), env(safe-area-inset-top));

      display: flex;
      flex-direction: column;

      gap: 4px;

      font-size: 11px;
      line-height: 1.25;

      letter-spacing: 0.01em;

      color: #fff;
    }


    /* =========================================================
       BODY STATE
       ========================================================= */

    body.menu-open .phone {
      opacity: 0;

      pointer-events: none;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      :root {
        --pad-x: 16px;
        --pad-y: 16px;
      }

      .menu {
        width: 42px;
        height: 28px;
      }

      .menu span {
        width: 26px;
      }

      .menu:hover span,
      body.menu-open .menu span,
      body.menu-open .menu:hover span {
        width: 26px;
      }

      .phone {
        font-size: 13px;
      }

      .overlay-nav a {
        padding: 2px 0;

        font-size: clamp(34px, 12vw, 58px);

        letter-spacing: -0.045em;
      }

      .overlay-nav a:hover {
        transform: none;
      }

      .overlay-meta {
        font-size: 10px;
      }
    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
    }
  </style>
</head>


<body>

  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header class="header">

    <!--
      Слева намеренно пусто.
      Никакого логотипа и никакого Ready.
    -->
    <span class="wordmark-empty" aria-hidden="true"></span>


    <!--
      Единственный элемент сверху:
      короткая горизонтальная полоска.
    -->
    <button
      class="menu"
      id="menuButton"
      type="button"
      aria-label="Открыть меню"
      aria-expanded="false"
      aria-controls="mainMenu"
    >
      <span></span>
    </button>

  </header>


  <!-- =======================================================
       CLOSED HOMEPAGE
       ======================================================= -->

  <main class="home">

    <a
      class="phone"
      href="tel:+79808007001"
      aria-label="Позвонить: 7 980 800 7 001"
    >
      7.980.800.7.001
    </a>

  </main>


  <!-- =======================================================
       LARGE DARK MENU
       ======================================================= -->

  <nav
    class="overlay"
    id="mainMenu"
    aria-hidden="true"
  >

    <div class="overlay-meta">
      <span>UNIT001.SYSTEMS</span>
      <span>MOSCOW / 2026</span>
    </div>


    <div class="overlay-nav">

      <a href="/ready">
        Ready.
      </a>

      <a href="/events">
        Events
      </a>

      <a href="mailto:hello@unit001.systems">
        Contact
      </a>

    </div>

  </nav>


  <!-- =======================================================
       SCRIPT
       ======================================================= -->

  <script>
    const body = document.body;
    const menuButton = document.getElementById("menuButton");
    const mainMenu = document.getElementById("mainMenu");

    function setMenuState(open) {
      body.classList.toggle("menu-open", open);

      menuButton.setAttribute(
        "aria-expanded",
        String(open)
      );

      menuButton.setAttribute(
        "aria-label",
        open ? "Закрыть меню" : "Открыть меню"
      );

      mainMenu.setAttribute(
        "aria-hidden",
        String(!open)
      );
    }


    menuButton.addEventListener("click", () => {
      const isOpen =
        body.classList.contains("menu-open");

      setMenuState(!isOpen);
    });


    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setMenuState(false);
      }
    });


    mainMenu.addEventListener("click", (event) => {

      const link = event.target.closest("a");

      if (link) {
        setMenuState(false);
      }

    });
  </script>

</body>
</html>
