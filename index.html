<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>UNIT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --black: #000;
      --white: #fff;

      --pad-x: 24px;
      --pad-y: 24px;

      --ease: cubic-bezier(.22,.75,.18,1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      width: 100%;
      height: 100dvh;

      overflow: hidden;

      background: var(--white);
      color: var(--black);

      font-family:
        Inter,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    a,
    a:link,
    a:visited,
    a:hover,
    a:focus,
    a:active {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =====================================================
       HOME
       ===================================================== */

    .home {
      position: relative;

      width: 100%;
      height: 100dvh;

      background: #fff;
    }

    /* =====================================================
       INVISIBLE HOME LINK AREA
       ===================================================== */

    .home-link {
      position: fixed;

      top: 0;
      left: 0;

      width: 120px;
      height: 72px;

      z-index: 20;
    }

    /* =====================================================
       MENU TRIGGER
       ===================================================== */

    .menu-button {
      position: fixed;

      top: var(--pad-y);
      right: var(--pad-x);

      z-index: 100;

      width: 40px;
      height: 32px;

      padding: 0;
      margin: 0;

      border: 0;
      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .menu-button span {
      position: absolute;

      top: 50%;
      right: 0;

      width: 28px;
      height: 1px;

      background: #000;

      transform:
        translateY(-50%)
        rotate(0deg);

      transform-origin: center;

      transition:
        transform 260ms var(--ease),
        background 200ms ease;
    }

    body.menu-open .menu-button span {
      background: #fff;

      transform:
        translateY(-50%)
        rotate(90deg);
    }

    /* =====================================================
       PHONE
       ===================================================== */

    .phone {
      position: fixed;

      left: var(--pad-x);
      bottom: var(--pad-y);

      z-index: 20;

      font-size: 22px;
      line-height: 1;

      font-weight: 400;

      letter-spacing: -0.02em;

      white-space: nowrap;
    }

    body.menu-open .phone {
      opacity: 0;
      pointer-events: none;
    }

    /* =====================================================
       OVERLAY MENU
       ===================================================== */

    .overlay {
      position: fixed;

      inset: 0;

      z-index: 80;

      background: #000;
      color: #fff;

      display: flex;
      align-items: flex-end;

      padding:
        0
        40px
        32px;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 220ms var(--ease),
        visibility 220ms var(--ease);
    }

    body.menu-open .overlay {
      opacity: 1;
      visibility: visible;

      pointer-events: auto;
    }

    /* =====================================================
       GIANT NAV
       ===================================================== */

    .overlay-nav {
      width: 100%;

      display: flex;
      flex-direction: column;

      align-items: flex-start;
    }

    .overlay-nav a {
      display: block;

      margin: 0;
      padding: 0;

      color: #fff;

      font-size: clamp(76px, 7.4vw, 150px);
      line-height: 0.92;

      font-weight: 400;

      letter-spacing: -0.055em;

      transition:
        opacity 160ms ease,
        transform 180ms var(--ease);
    }

    .overlay-nav:hover a {
      opacity: 0.28;
    }

    .overlay-nav a:hover {
      opacity: 1;
      transform: translateX(10px);
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      :root {
        --pad-x: 16px;
        --pad-y: 16px;
      }

      .phone {
        font-size: 22px;
      }

      .menu-button {
        width: 36px;
        height: 28px;
      }

      .menu-button span {
        width: 24px;
      }

      .overlay {
        padding:
          0
          16px
          20px;
      }

      .overlay-nav a {
        font-size: clamp(54px, 15vw, 92px);
        line-height: 0.94;
      }

      .overlay-nav a:hover {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="home">

    <!-- Пустая зона слева сверху ведёт на главную -->
    <a
      class="home-link"
      href="/"
      aria-label="Главная"
    ></a>

    <!-- Только полоска -->
    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="Открыть меню"
      aria-expanded="false"
      aria-controls="overlay"
    >
      <span></span>
    </button>

    <!-- Телефон -->
    <a
      class="phone"
      href="tel:+79808007001"
    >
      7.980.800.7.001
    </a>

  </main>

  <!-- Большое чёрное меню -->
  <nav
    class="overlay"
    id="overlay"
    aria-hidden="true"
  >
    <div class="overlay-nav">

      <a href="/r">
        READY
      </a>

      <a href="/e">
        EVENTS
      </a>

      <a href="mailto:hello@unit001.systems">
        CONTACT
      </a>

    </div>
  </nav>

  <script>
    const body = document.body;
    const button = document.getElementById("menuButton");
    const overlay = document.getElementById("overlay");

    function setMenu(open) {
      body.classList.toggle("menu-open", open);

      button.setAttribute(
        "aria-expanded",
        String(open)
      );

      button.setAttribute(
        "aria-label",
        open ? "Закрыть меню" : "Открыть меню"
      );

      overlay.setAttribute(
        "aria-hidden",
        String(!open)
      );
    }

    button.addEventListener("click", () => {
      const open = !body.classList.contains("menu-open");
      setMenu(open);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setMenu(false);
      }
    });

    overlay.addEventListener("click", (event) => {
      if (event.target.closest("a")) {
        setMenu(false);
      }
    });
  </script>

</body>
</html>
