<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>UNIT001.SYSTEMS</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #fff;
  color: #000;
  font-family: Helvetica, Arial, sans-serif;
}

a {
  color: #000;
  text-decoration: none;
}


/* SYSTEM TYPE */

.system {
  font-family:
    "SFMono-Regular",
    Consolas,
    "Liberation Mono",
    Menlo,
    monospace;

  font-size: 11px;
  line-height: 1.35;
  letter-spacing: .03em;
  text-transform: uppercase;
}


/* SCREEN */

.screen {
  width: 100vw;
  height: 100dvh;

  padding:
    max(20px, env(safe-area-inset-top))
    max(24px, env(safe-area-inset-right))
    max(20px, env(safe-area-inset-bottom))
    max(24px, env(safe-area-inset-left));

  display: grid;

  grid-template-rows:
    auto
    1fr
    auto;

  overflow: hidden;
}


/* HEADER */

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.status {
  text-align: right;
}

.dot {
  display: inline-block;

  width: 6px;
  height: 6px;

  margin-right: 7px;

  background: #000;

  animation: blink 1.8s steps(1) infinite;
}

@keyframes blink {

  50% {
    opacity: 0;
  }

}


/* MAIN */

main {
  min-height: 0;

  display: flex;
  flex-direction: column;
  justify-content: center;

  align-items: flex-start;
}


/* LOGO */

h1 {
  margin: 0;

  font-size: clamp(58px, 9vw, 136px);
  line-height: .79;

  font-weight: 400;

  letter-spacing: -.075em;
}

.description {
  margin-top: 32px;

  max-width: 430px;

  font-size: clamp(14px, 1.25vw, 17px);
  line-height: 1.35;
}


/* NAVIGATION */

nav {
  width: min(620px, 100%);

  margin-top: clamp(36px, 6vh, 68px);

  border-top: 1px solid #000;
}

nav a {
  display: grid;

  grid-template-columns:
    44px
    1fr
    auto;

  gap: 12px;

  padding: clamp(9px, 1.3vh, 14px) 0;

  border-bottom: 1px solid #000;

  transition: opacity .15s ease;
}

nav a:hover {
  opacity: .35;
}


/* FOOTER */

footer {
  display: flex;

  justify-content: space-between;
  align-items: flex-end;

  gap: 40px;
}

footer .right {
  text-align: right;
}


/* MOBILE */

@media (max-width: 600px) {

  .screen {
    padding:
      max(15px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(15px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }

  .system {
    font-size: 9px;
  }

  h1 {
    font-size: clamp(62px, 20vw, 92px);
  }

  .description {
    margin-top: 22px;

    max-width: 330px;

    font-size: 13px;
  }

  nav {
    margin-top: 30px;
  }

  nav a {
    grid-template-columns:
      32px
      1fr
      auto;

    padding: 9px 0;
  }

  footer {
    gap: 15px;
  }

}


/* SHORT SCREENS */

@media (max-height: 650px) {

  h1 {
    font-size: clamp(48px, 8vw, 90px);
  }

  .description {
    margin-top: 18px;
  }

  nav {
    margin-top: 22px;
  }

  nav a {
    padding: 7px 0;
  }

}

</style>
</head>


<body>

<div class="screen">


<header class="system">

  <div>
    — UNIT001<br>
    VISUAL SYSTEM
  </div>

  <div class="status">
    <span class="dot"></span>ACTIVE<br>
    MOSCOW / 2026
  </div>

</header>



<main>

  <h1>
    UNIT<br>
    001.
  </h1>


  <div class="description">
    Visual systems for people and events.<br>
    Photography, moving image, data and documentation.
  </div>


  <nav class="system">

    <a href="/model">
      <span>01</span>
      <span>MODEL READY</span>
      <span>→</span>
    </a>

    <a href="/actor">
      <span>02</span>
      <span>ACTOR READY</span>
      <span>→</span>
    </a>

    <a href="/dash">
      <span>03</span>
      <span>DASH / EVENTS</span>
      <span>→</span>
    </a>

    <a href="mailto:hello@unit001.systems">
      <span>04</span>
      <span>CONTACT</span>
      <span>↗</span>
    </a>

  </nav>

</main>



<footer class="system">

  <div>
    UNIT001.SYSTEMS
  </div>

  <div class="right">
    EVERY OBJECT HAS A POSITION.<br>
    EVERY EVENT LEAVES A TRACE.
  </div>

</footer>


</div>

</body>
</html>
