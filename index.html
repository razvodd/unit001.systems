<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>UNIT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --page-x: 8px;
      --page-y: 8px;

      --header-height: 36px;
      --header-bg: rgba(220, 220, 220, 0.76);

      --black: #000;
      --white: #fff;

      --ease: cubic-bezier(.22,.75,.18,1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      width: 100%;
      height: 100dvh;

      overflow: hidden;

      background: #fff;
      color: #000;

      font-family:
        Inter,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    a,
    a:link,
    a:visited,
    a:hover,
    a:focus,
    a:active {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      position: fixed;

      z-index: 100;

      top: var(--page-y);
      left: var(--page-x);
      right: var(--page-x);

      height: var(--header-height);

      border-radius: 18px;

      background: var(--header-bg);

      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);

      display: flex;
      align-items: center;
      justify-content: space-between;

      overflow: hidden;

      transition:
        background 240ms var(--ease);
    }


    /* ПУСТАЯ ЗОНА ВМЕСТО READY */

    .home-zone {
      display: block;

      height: 100%;
      flex: 1;

      cursor: pointer;
    }


    /* =====================================================
       MENU BUTTON
       ===================================================== */

    .menu-button {
      position: relative;

      flex: 0 0 44px;

      width: 44px;
      height: 100%;

      padding: 0;
      margin: 0;

      border: 0;

      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .menu-button span {
      position: absolute;

      left: 50%;
      top: 50%;

      display: block;

      width: 14px;
      height: 1px;

      background: #000;

      transform:
        translate(-50%, -50%)
        rotate(0deg);

      transform-origin: center;

      transition:
        transform 280ms var(--ease),
        background 220ms var(--ease);
    }


    /* ОТКРЫТО — ГОРИЗОНТАЛЬНАЯ СТАНОВИТСЯ ВЕРТИКАЛЬНОЙ */

    body.menu-open .menu-button span {
      transform:
        translate(-50%, -50%)
        rotate(90deg);
    }


    /* =====================================================
       CLOSED HOME
       ===================================================== */

    .home {
      position: relative;

      width: 100%;
      height: 100dvh;
    }

    .phone {
      position: fixed;

      z-index: 20;

      left: 24px;
      bottom: 22px;

      font-size: 22px;
      line-height: 1;

      font-weight: 400;
      letter-spacing: -0.02em;

      white-space: nowrap;

      transition:
        opacity 180ms ease;
    }


    /* =====================================================
       OVERLAY
       ===================================================== */

    .overlay {
      position: fixed;

      z-index: 50;

      inset: 0;

      padding:
        0
        36px
        38px;

      background: #000;
      color: #fff;

      display: flex;
      align-items: flex-end;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 240ms var(--ease),
        visibility 240ms var(--ease);
    }

    body.menu-open .overlay {
      opacity: 1;
      visibility: visible;

      pointer-events: auto;
    }


    /*
      Header остаётся поверх overlay.
    */

    body.menu-open .header {
      background: rgba(190, 190, 190, 0.86);
    }

    body.menu-open .phone {
      opacity: 0;
      pointer-events: none;
    }


    /* =====================================================
       GIANT NAV
       ===================================================== */

    .overlay-nav {
      display: flex;
      flex-direction: column;

      align-items: flex-start;

      width: 100%;

      padding-bottom: 0;
    }

    .overlay-nav a {
      display: block;

      margin: 0;

      padding: 0;

      color: #fff;

      font-size: clamp(72px, 7.5vw, 150px);
      line-height: 0.92;

      font-weight: 400;

      letter-spacing: -0.055em;

      transition:
        opacity 160ms ease,
        transform 200ms var(--ease);
    }

    .overlay-nav:hover a {
      opacity: 0.35;
    }

    .overlay-nav a:hover {
      opacity: 1;

      transform: translateX(10px);
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      :root {
        --page-x: 6px;
        --page-y: 6px;
        --header-height: 34px;
      }

      .header {
        border-radius: 17px;
      }

      .phone {
        left: 16px;
        bottom: 16px;

        font-size: 22px;
      }

      .overlay {
        padding:
          0
          16px
          22px;
      }

      .overlay-nav a {
        font-size: clamp(52px, 15vw, 90px);
        line-height: 0.94;
      }

      .overlay-nav a:hover {
        transform: none;
      }
    }


    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }

  </style>
</head>


<body>


  <!-- HEADER -->

  <header class="header">

    <!--
      Здесь раньше было Ready.
      Теперь визуально здесь НИЧЕГО.

      Но вся пустая левая зона — ссылка на главную.
    -->
    <a
      class="home-zone"
      href="/"
      aria-label="Главная"
    ></a>


    <!--
      Горизонтальная палочка.
      При открытии становится вертикальной.
    -->
    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="Открыть меню"
      aria-expanded="false"
      aria-controls="overlay"
    >
      <span></span>
    </button>

  </header>



  <!-- ГЛАВНАЯ -->

  <main class="home">

    <a
      class="phone"
      href="tel:+79808007001"
    >
      7.980.800.7.001
    </a>

  </main>



  <!-- БОЛЬШОЕ МЕНЮ -->

  <nav
    class="overlay"
    id="overlay"
    aria-hidden="true"
  >

    <div class="overlay-nav">

      <a href="/ready">
        READY
      </a>

      <a href="/events">
        EVENTS
      </a>

      <a href="mailto:hello@unit001.systems">
        CONTACT
      </a>

    </div>

  </nav>



  <script>
    const body = document.body;
    const button = document.getElementById("menuButton");
    const overlay = document.getElementById("overlay");


    function setMenu(open) {

      body.classList.toggle("menu-open", open);

      button.setAttribute(
        "aria-expanded",
        String(open)
      );

      button.setAttribute(
        "aria-label",
        open
          ? "Закрыть меню"
          : "Открыть меню"
      );

      overlay.setAttribute(
        "aria-hidden",
        String(!open)
      );

    }


    button.addEventListener("click", () => {

      const open =
        !body.classList.contains("menu-open");

      setMenu(open);

    });


    document.addEventListener("keydown", (event) => {

      if (event.key === "Escape") {
        setMenu(false);
      }

    });


    overlay.addEventListener("click", (event) => {

      if (event.target.closest("a")) {
        setMenu(false);
      }

    });

  </script>

</body>
</html>
