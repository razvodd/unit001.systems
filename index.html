<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>UNIT</title>

  <style>
    :root {
      --x: 24px;
      --y: 24px;

      --display-size: clamp(90px, 12vw, 210px);
      --phone-size: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      background: #fff;
      color: #000;

      font-family: Helvetica, Arial, sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    a,
    a:link,
    a:visited,
    a:hover,
    a:focus,
    a:active {
      color: inherit;
      text-decoration: none;
    }


    /* EMPTY HOME AREA */

    .home-link {
      position: fixed;

      top: 0;
      left: 0;

      width: 140px;
      height: 72px;

      z-index: 300;
    }


    /* MENU BUTTON */

    .menu {
      position: fixed;

      top: var(--y);
      right: var(--x);

      z-index: 300;

      width: 46px;
      height: 34px;

      padding: 0;

      border: 0;
      background: transparent;

      cursor: pointer;
    }

    .menu span {
      position: absolute;

      top: 50%;
      right: 0;

      width: 38px;
      height: 2px;

      background: #000;

      transform:
        translateY(-50%)
        rotate(0deg);

      transform-origin: center;

      transition:
        transform .25s ease,
        background .2s ease;
    }

    body.menu-open .menu span {
      background: #fff;

      transform:
        translateY(-50%)
        rotate(90deg);
    }


    /* BOTTOM BLOCK */

    .bottom {
      position: fixed;

      left: var(--x);
      bottom: var(--y);

      z-index: 20;
    }


    /* DISPLAY NAV */

    .display-nav {
      display: flex;
      flex-direction: column;

      align-items: flex-start;

      gap: 14px;

      margin-bottom: 32px;
    }

    .display-nav a {
      display: block;

      margin: 0;

      font-size: var(--display-size);
      line-height: .72;

      font-weight: 400;

      letter-spacing: -.075em;

      transform: translateX(-0.055em);
    }


    /* PHONE */

    .phone {
      display: block;

      font-size: var(--phone-size);
      line-height: 1;

      letter-spacing: -.025em;
    }


    /* OVERLAY */

    .overlay {
      position: fixed;

      inset: 0;

      z-index: 100;

      background: #000;
      color: #fff;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity .2s ease,
        visibility .2s ease;
    }

    body.menu-open .overlay {
      opacity: 1;
      visibility: visible;

      pointer-events: auto;
    }

    .overlay-bottom {
      position: absolute;

      left: var(--x);
      bottom: var(--y);
    }


    /* MOBILE */

    @media (max-width: 700px) {

      :root {
        --x: 18px;
        --y: 18px;

        --display-size: 24vw;
        --phone-size: 22px;
      }

      .display-nav {
        gap: 10px;
        margin-bottom: 28px;
      }

      .menu span {
        width: 36px;
      }
    }
  </style>
</head>


<body>


  <a
    class="home-link"
    href="/"
    aria-label="Home"
  ></a>


  <button
    class="menu"
    id="menu"
    type="button"
    aria-label="Open menu"
    aria-expanded="false"
  >
    <span></span>
  </button>


  <!-- MAIN PAGE -->

  <div class="bottom">

    <nav class="display-nav">

      <a href="/r/">
        READY
      </a>

      <a href="/e/">
        EVENT
      </a>

    </nav>


    <a
      class="phone"
      href="tel:+79808007001"
    >
      7.980.800.7.001
    </a>

  </div>


  <!-- MENU -->

  <div class="overlay">

    <div class="overlay-bottom">

      <nav class="display-nav">

        <a href="/r/">
          READY
        </a>

        <a href="/e/">
          EVENT
        </a>

      </nav>


      <a
        class="phone"
        href="tel:+79808007001"
      >
        7.980.800.7.001
      </a>

    </div>

  </div>


  <script>
    const menu =
      document.getElementById("menu");

    menu.addEventListener("click", () => {

      const open =
        document.body.classList.toggle(
          "menu-open"
        );

      menu.setAttribute(
        "aria-expanded",
        String(open)
      );

    });


    document.addEventListener(
      "keydown",
      event => {

        if (event.key === "Escape") {

          document.body.classList.remove(
            "menu-open"
          );

          menu.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      }
    );
  </script>


</body>
</html>
