<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>UNIT001.SYSTEMS</title>

  <style>
    :root {
      --black: #000;
      --white: #fff;

      --pad-x: 24px;
      --pad-y: 24px;

      --ease: cubic-bezier(.22,.75,.18,1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      width: 100%;
      height: 100dvh;

      overflow: hidden;

      background: var(--white);
      color: var(--black);

      font-family:
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    a,
    a:link,
    a:visited,
    a:hover,
    a:focus,
    a:active {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }


    /* --------------------------------
       PAGE
       -------------------------------- */

    .page {
      position: relative;

      width: 100vw;
      height: 100dvh;

      overflow: hidden;

      background: #fff;
    }


    /* --------------------------------
       MENU BUTTON
       -------------------------------- */

    .menu {
      position: fixed;

      top: var(--pad-y);
      right: var(--pad-x);

      z-index: 100;

      width: 34px;
      height: 24px;

      padding: 0;
      margin: 0;

      border: 0;
      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .menu span {
      position: absolute;

      top: 50%;
      right: 0;

      width: 26px;
      height: 1px;

      background: #000;

      transform:
        translateY(-50%)
        rotate(0deg);

      transform-origin: center;

      transition:
        transform 260ms var(--ease),
        background 180ms ease;
    }

    body.menu-open .menu span {
      background: #fff;

      transform:
        translateY(-50%)
        rotate(90deg);
    }


    /* --------------------------------
       PHONE
       -------------------------------- */

    .phone {
      position: fixed;

      left: var(--pad-x);
      bottom: var(--pad-y);

      z-index: 20;

      font-size: 22px;
      line-height: 1;

      font-weight: 400;

      letter-spacing: -.025em;

      white-space: nowrap;

      transition:
        opacity 160ms ease;
    }

    body.menu-open .phone {
      opacity: 0;
      pointer-events: none;
    }


    /* --------------------------------
       FULL SCREEN MENU
       -------------------------------- */

    .overlay {
      position: fixed;

      inset: 0;

      z-index: 80;

      background: #000;
      color: #fff;

      display: flex;
      align-items: flex-end;

      padding:
        0
        var(--pad-x)
        var(--pad-y);

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 220ms var(--ease),
        visibility 220ms var(--ease);
    }

    body.menu-open .overlay {
      opacity: 1;
      visibility: visible;

      pointer-events: auto;
    }


    /* --------------------------------
       NAV
       -------------------------------- */

    .overlay-nav {
      display: flex;
      flex-direction: column;

      align-items: flex-start;
    }

    .overlay-nav a {
      display: block;

      margin: 0;
      padding: 0;

      font-size: clamp(90px, 12vw, 210px);
      line-height: .82;

      font-weight: 400;

      letter-spacing: -.075em;

      transition:
        opacity 150ms ease,
        transform 180ms var(--ease);
    }

    .overlay-nav:hover a {
      opacity: .25;
    }

    .overlay-nav a:hover {
      opacity: 1;

      transform: translateX(8px);
    }


    /* --------------------------------
       MOBILE
       -------------------------------- */

    @media (max-width: 700px) {

      :root {
        --pad-x: 16px;
        --pad-y: 16px;
      }

      .phone {
        font-size: 22px;
      }

      .overlay-nav a {
        font-size: 24vw;
      }

      .overlay-nav a:hover {
        transform: none;
      }
    }


    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
      }

    }

  </style>
</head>


<body>


  <main class="page">

    <!-- TOP RIGHT DASH -->

    <button
      class="menu"
      id="menuButton"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      <span></span>
    </button>


    <!-- BOTTOM LEFT PHONE -->

    <a
      class="phone"
      href="tel:+79808007001"
    >
      7.980.800.7.001
    </a>

  </main>


  <!-- FULL SCREEN MENU -->

  <nav
    class="overlay"
    id="overlay"
    aria-hidden="true"
  >

    <div class="overlay-nav">

      <a href="/r/">
        R
      </a>

      <a href="/e/">
        E
      </a>

    </div>

  </nav>


  <script>

    const button =
      document.getElementById("menuButton");

    const overlay =
      document.getElementById("overlay");


    function setMenu(open) {

      document.body.classList.toggle(
        "menu-open",
        open
      );

      button.setAttribute(
        "aria-expanded",
        String(open)
      );

      button.setAttribute(
        "aria-label",
        open
          ? "Close menu"
          : "Open menu"
      );

      overlay.setAttribute(
        "aria-hidden",
        String(!open)
      );

    }


    button.addEventListener(
      "click",
      () => {

        setMenu(
          !document.body.classList.contains(
            "menu-open"
          )
        );

      }
    );


    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Escape") {
          setMenu(false);
        }

      }
    );


    overlay.addEventListener(
      "click",
      (event) => {

        if (event.target.closest("a")) {
          setMenu(false);
        }

      }
    );

  </script>


</body>
</html>
