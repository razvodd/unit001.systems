<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>UNIT</title>

<style>
  :root {
    --black: #000;
    --white: #fff;

    --x: clamp(18px, 2.2vw, 32px);
    --y: clamp(18px, 2.2vw, 28px);

    --font:
      "SFMono-Regular",
      Consolas,
      "Liberation Mono",
      Menlo,
      monospace;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    background: var(--white);
    color: var(--black);
    font-family: var(--font);
  }

  a,
  a:link,
  a:visited,
  a:hover,
  a:focus,
  a:active {
    color: inherit;
    text-decoration: none;
  }

  button {
    font: inherit;
  }

  /* PAGE */

  .page {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background: #fff;
  }

  /* MENU TRIGGER */

  .menu-trigger {
    position: fixed;
    z-index: 100;

    top: var(--y);
    right: var(--x);

    width: 42px;
    height: 24px;

    padding: 0;
    margin: 0;

    border: 0;
    background: transparent;

    cursor: pointer;
  }

  .menu-trigger::before {
    content: "";

    position: absolute;

    right: 0;
    top: 50%;

    width: 28px;
    height: 1px;

    background: #000;

    transform: translateY(-50%);
    transform-origin: right center;

    transition:
      width 180ms ease,
      transform 220ms ease;
  }

  .menu-trigger:hover::before {
    width: 38px;
  }

  body.menu-open .menu-trigger::before {
    width: 28px;
    transform:
      translateY(-50%)
      rotate(-45deg);
  }

  /* PHONE */

  .phone {
    position: fixed;
    z-index: 20;

    left: var(--x);
    bottom: var(--y);

    font-size: clamp(11px, 0.9vw, 13px);
    line-height: 1;
    letter-spacing: 0.025em;

    white-space: nowrap;
  }

  /* TRANSPARENT MENU */

  .menu {
    position: fixed;
    z-index: 50;

    inset: 0;

    pointer-events: none;

    opacity: 0;
    visibility: hidden;

    transition:
      opacity 240ms ease,
      visibility 240ms ease;
  }

  .menu-surface {
    position: absolute;
    inset: 0;

    background: rgba(255, 255, 255, 0.72);

    -webkit-backdrop-filter: blur(22px);
    backdrop-filter: blur(22px);

    transform: translateY(-8px);

    transition:
      transform 280ms cubic-bezier(.2,.8,.2,1);
  }

  body.menu-open .menu {
    pointer-events: auto;

    opacity: 1;
    visibility: visible;
  }

  body.menu-open .menu-surface {
    transform: translateY(0);
  }

  /* MENU CONTENT */

  .menu-content {
    position: absolute;

    top: calc(var(--y) + 58px);
    right: var(--x);

    display: flex;
    flex-direction: column;
    align-items: flex-end;

    gap: 10px;

    text-align: right;

    font-size: clamp(11px, 0.9vw, 13px);
    line-height: 1.2;
    letter-spacing: 0.02em;
  }

  .menu-content a {
    position: relative;

    display: inline-block;

    transition:
      transform 160ms ease;
  }

  .menu-content a:hover {
    transform: translateX(-6px);
  }

  /* OPTIONAL SMALL INDEX */

  .menu-content .index {
    display: inline-block;

    min-width: 34px;

    margin-right: 12px;

    text-align: left;
  }

  /* MOBILE */

  @media (max-width: 600px) {
    :root {
      --x: 16px;
      --y: 16px;
    }

    .phone {
      font-size: 11px;
    }

    .menu-content {
      top: 64px;
      font-size: 11px;
      gap: 12px;
    }

    .menu-trigger {
      width: 38px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      transition: none !important;
    }
  }
</style>
</head>

<body>

<div class="page">

  <!-- MENU BUTTON -->
  <button
    class="menu-trigger"
    id="menuTrigger"
    aria-label="Open menu"
    aria-expanded="false">
  </button>


  <!-- ONLY OBJECT ON BOTTOM LEFT -->
  <a
    class="phone"
    href="tel:+7XXXXXXXXXX">
    +7.XXX.XXX.XX.XX
  </a>


  <!-- TRANSPARENT MENU -->
  <div class="menu" id="menu" aria-hidden="true">

    <div class="menu-surface"></div>

    <nav class="menu-content">

      <a href="/ready">
        <span class="index">01</span>READY
      </a>

      <a href="/events">
        <span class="index">02</span>EVENTS
      </a>

      <a href="mailto:hello@unit001.systems">
        <span class="index">03</span>CONTACT
      </a>

    </nav>

  </div>

</div>


<script>
  const trigger = document.getElementById("menuTrigger");
  const menu = document.getElementById("menu");

  function setMenu(open) {
    document.body.classList.toggle("menu-open", open);

    trigger.setAttribute("aria-expanded", String(open));
    trigger.setAttribute(
      "aria-label",
      open ? "Close menu" : "Open menu"
    );

    menu.setAttribute("aria-hidden", String(!open));
  }

  trigger.addEventListener("click", () => {
    const open = !document.body.classList.contains("menu-open");
    setMenu(open);
  });

  menu.addEventListener("click", (event) => {
    if (
      event.target === menu ||
      event.target.classList.contains("menu-surface")
    ) {
      setMenu(false);
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      setMenu(false);
    }
  });
</script>

</body>
</html>
